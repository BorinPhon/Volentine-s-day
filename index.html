<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love 💖</title>
    <style>
        body {
            text-align: center;
            color: #ff4b5c;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: background-image 1.5s ease-in-out;
            z-index: -1;
        }
        h1 {
            font-size: 2.5em;
        }
        .hidden-message {
            display: none;
            font-size: 1.5em;
            margin-top: 20px;
        }
        button {
            background-color: #ff4b5c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.2em;
            cursor: pointer;
            margin-top: 20px;
            border-radius: 20px;
        }
        button:hover {
            background-color: #ff2e42;
        }
        .heart {
            position: absolute;
            font-size: 20px;
            color: #ff4b5c;
            animation: float 4s linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }
        /* Slider Container */
        .slider {
        position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.2;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        }

        /* Slides Wrapper */
        .slides {
        display: flex;
        width: 300%; /* Adjust based on the number of images */
        height: 100%;
        animation: slideAnimation 30s infinite; /* Auto-slide every 12 seconds */
        }

        /* Each Slide */
        .slide {
        position: relative;
        z-index: -1;  
        width: 100vw;
        height: 100vh;
        background-size: cover;
        background-position: center;
        }

        /* Keyframes for Sliding Effect */
        @keyframes slideAnimation {
        0% { transform: translateX(0); }
        33.33% { transform: translateX(-100vw); }
        66.66% { transform: translateX(-200vw); }
        100% { transform: translateX(0); }
        }
        .shape {
            width: 120px;
            height: 120px;
            margin: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: floatPhoto var(--float-duration, 4s) linear infinite;
        }
        @keyframes floatPhoto {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 1; }
            25% { transform: translateY(-20px) translateX(calc(var(--float-direction, 1) * 10px)) scale(1.05); opacity: 0.95; }
            50% { transform: translateY(-40px) translateX(calc(var(--float-direction, 1) * 20px)) scale(1.1); opacity: 0.9; }
            75% { transform: translateY(-20px) translateX(calc(var(--float-direction, 1) * 10px)) scale(1.05); opacity: 0.95; }
            100% { transform: translateY(0) translateX(0) scale(1); opacity: 1; }
        }
        .shape:nth-child(1) { --float-direction: 1; --float-duration: 4s; }
        .shape:nth-child(2) { --float-direction: -1; --float-duration: 5s; }
        .shape:nth-child(3) { --float-direction: 1; --float-duration: 3.5s; }
        .shape:nth-child(4) { --float-direction: -1; --float-duration: 4.5s; }
        .shape:nth-child(5) { --float-direction: 1; --float-duration: 5.2s; }
        .shape img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .heart-shape {
            clip-path: polygon(
                50% 15%,
                61% 0%,
                100% 19%,
                100% 62%,
                50% 100%,
                0% 62%,
                0% 19%,
                39% 0%
            );
        }
        .square-shape {
            border-radius: 0;
        }
        .rectangle-shape {
            width: 180px;
            height: 120px;
        }
        .triangle-shape {
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        .circle-shape {
            border-radius: 50%;
        }
        @media (max-width: 900px) {
            .shape {
                width: 80px;
                height: 80px;
                margin: 8px;
            }
            .rectangle-shape {
                width: 80px;
                height: 80px;
            }
        }
        @media (max-width: 600px) {
            .shape {
                width: 50px;
                height: 50px;
                margin: 4px;
            }
            .rectangle-shape {
                width: 50px;
                height: 50px;
            }
        }
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #ff4b5c;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            /* Ensure loader is visible and spinning */
            display: block;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="slider">
        <div class="slides">
          <div class="slide" style="background-image: url('assets/img/1.jpg');"></div>
          <div class="slide" style="background-image: url('assets/img/2.jpg');"></div>
          <div class="slide" style="background-image: url('assets/img/3.jpg');"></div>
          <div class="slide" style="background-image: url('assets/img/memories1.jpg');"></div>
          <div class="slide" style="background-image: url('assets/img/memories2.jpg');"></div>
          <div class="slide" style="background-image: url('assets/img/memories3.jpg');"></div>
          <div class="slide" style="background-image: url('assets/img/memories4.jpg');"></div>
          <div class="slide" style="background-image: url('assets/img/memories5.jpg');"></div>
          <div class="slide" style="background-image: url('assets/img/memories6.jpg');"></div>
          
        </div>
      </div>
    <div class="background" id="background"></div>
    <div id="photo-shapes" style="display:none; margin-top:30px;"></div>
    <h1>Dear Nit💖</h1>
    <h1>Happy Valentine's Day, My Love! 💖</h1>
    <p>You make my world brighter every day. 💕</p>
    <button onclick="showSurpriseSequence()">Click for a Surprise! 💝</button>
    <p class="hidden-message" id="message">You are my heart, my happiness, and my forever. I love you! Nit❤️</p>
    <audio id="music" src="assets/img/bensound-romantic.mp3" loop></audio>
    <!-- Valentine Question Popup (hidden by default) -->
    <div id="valentine-question" style="display:none; flex-direction:column; align-items:center; justify-content:center; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(255,255,255,0.95); z-index:1000;">
        <h2 style="color:#ff4b5c;">Do you love me?</h2>
        <div style="margin-top:20px;">
            <button id="yesBtn" style="margin-right:20px; background:#ff4b5c; color:white; border:none; padding:10px 30px; font-size:1.2em; border-radius:20px; cursor:pointer; z-index:1001;">Yes</button>
            <button id="noBtn" style="background:#ccc; color:#333; border:none; padding:10px 30px; font-size:1.2em; border-radius:20px; cursor:pointer; position:relative;">No</button>
        </div>
    </div>
    <div id="loading-animation" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(255,255,255,0.8); z-index:2000; align-items:center; justify-content:center;">
  <div style="display:flex; flex-direction:column; align-items:center;">
    <div class="loader" style="border: 8px solid #f3f3f3; border-top: 8px solid #ff4b5c; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite;"></div>
    <p style="margin-top:20px; color:#ff4b5c; font-size:1.2em;">Preparing your surprise...</p>
  </div>
</div>
    <script>
        function showMessage() {
            document.getElementById('message').style.display = 'block';
            document.getElementById('music').play();
            displayPhotoShapes();
        }
        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '💖';
            heart.classList.add('heart');
            document.body.appendChild(heart);
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            
            setTimeout(() => { heart.remove(); }, 4000);
        }
        setInterval(createHeart, 500);
        
        function displayPhotoShapes() {
            const container = document.getElementById('photo-shapes');
            container.style.display = 'flex';
            container.style.flexWrap = 'wrap';
            container.style.justifyContent = 'center';
            container.innerHTML = `
                <div class="shape heart-shape"><img src="assets/img/memories1.jpg" alt="Heart"/></div>
                <div class="shape square-shape"><img src="assets/img/memories2.jpg" alt="Square"/></div>
                <div class="shape rectangle-shape"><img src="assets/img/memories3.jpg" alt="Rectangle"/></div>
                <div class="shape triangle-shape"><img src="assets/img/memories4.jpg" alt="Triangle"/></div>
                <div class="shape circle-shape"><img src="assets/img/memories5.jpg" alt="Circle"/></div>
            `;
        }
        // Background Slideshow
       

    // Valentine Question Logic
    let movingInterval = null;
    function moveNoButtonResponsive(e) {
        const parent = noBtn.parentElement;
        const parentRect = parent.getBoundingClientRect();
        const btnWidth = noBtn.offsetWidth;
        const btnHeight = noBtn.offsetHeight;
        const yesRect = yesBtn.getBoundingClientRect();
        const maxX = parentRect.width - btnWidth;
        const maxY = parentRect.height - btnHeight;
        let randX, randY, tries = 0;
        do {
            randX = Math.random() * maxX;
            randY = Math.random() * maxY;
            tries++;
        } while (
            tries < 100 &&
            randX < (yesBtn.offsetLeft + yesBtn.offsetWidth) &&
            randX + btnWidth > yesBtn.offsetLeft &&
            randY < (yesBtn.offsetTop + yesBtn.offsetHeight) &&
            randY + btnHeight > yesBtn.offsetTop
        );
        noBtn.style.left = randX + 'px';
        noBtn.style.top = randY + 'px';
        noBtn.style.zIndex = 1;
        yesBtn.style.position = 'relative';
        yesBtn.style.left = '0px';
        yesBtn.style.top = '0px';
        yesBtn.style.zIndex = 2;
    }
    // Remove any z-index or position styling from Yes button
    if (yesBtn) {
        yesBtn.style.position = '';
        yesBtn.style.zIndex = '';
    }
    // Remove any accidental pointer-events:none from Yes button
    if (yesBtn) {
        yesBtn.style.pointerEvents = 'auto';
    }
    // Ensure Yes button event listener is set up correctly
    if (yesBtn && !yesBtn._listenerSet) {
        yesBtn.addEventListener('click', function() {
            document.getElementById('loading-animation').style.display = 'none';
            if (typeof resetNoButton === 'function') resetNoButton();
            showMessage();
            // Show "I love you too!" message
            let loveMsg = document.getElementById('love-message');
            if (!loveMsg) {
                loveMsg = document.createElement('div');
                loveMsg.id = 'love-message';
                loveMsg.style.position = 'fixed';
                loveMsg.style.top = '50%';
                loveMsg.style.left = '50%';
                loveMsg.style.transform = 'translate(-50%, -50%)';
                loveMsg.style.fontSize = '2.5em';
                loveMsg.style.color = '#d90429';
                loveMsg.style.background = '#ffe6ea';
                loveMsg.style.padding = '40px 60px';
                loveMsg.style.borderRadius = '30px';
                loveMsg.style.zIndex = 3000;
                loveMsg.style.textAlign = 'center';
                loveMsg.style.boxShadow = '0 4px 32px rgba(0,0,0,0.08)';
                document.body.appendChild(loveMsg);
            }
            loveMsg.innerHTML = '<span class="icon">💖</span><span style="display:inline-block;white-space:normal;">I love you too!</span>' +
                '<video id="love-video" src="assets/img/cutevdo.mp4" style="margin-top:20px; max-width:90vw; width:320px; border-radius:16px; box-shadow:0 2px 16px rgba(0,0,0,0.08); background:#000; display:block;" autoplay playsinline></video>';
            // Pause music and play video with sound only once
            const music = document.getElementById('music');
            if (music) music.pause();
            setTimeout(() => {
                const v = document.getElementById('love-video');
                if (v) {
                    v.muted = false;
                    v.volume = 1.0;
                    v.loop = false;
                    v.load();
                    v.play().catch(()=>{});
                }
            }, 100);
            // After 4 seconds, hide message, video, and resume music
            setTimeout(() => {
                loveMsg.style.display = 'none';
                document.getElementById('valentine-question').style.display = 'none';
                document.getElementById('loading-animation').style.display = 'none';
                if (music) music.play();
            }, 8000);
        });
        yesBtn._listenerSet = true;
    }
    // Remove all previous listeners before adding new ones
    noBtn.onmousemove = moveNoButtonResponsive;
    noBtn.onmouseenter = moveNoButtonResponsive;
    noBtn.onclick = function(e) {
        if (movingInterval) return;
        moveNoButtonResponsive(e);
        movingInterval = setInterval(() => moveNoButtonResponsive(e), 300);
    };
    function resetNoButton() {
        if (movingInterval) {
            clearInterval(movingInterval);
            movingInterval = null;
        }
        noBtn.style.position = 'relative';
        noBtn.style.left = '';
        noBtn.style.top = '';
    }
    function showValentineQuestion() {
        document.getElementById('valentine-question').style.display = 'flex';
        resetNoButton(); // Always reset No button state when showing popup
    }
    yesBtn.addEventListener('click', function() {
        valentineDiv.style.display = 'none';
        document.getElementById('loading-animation').style.display = 'none';
        if (typeof resetNoButton === 'function') resetNoButton();
        showMessage();
    });
    function showSurpriseSequence() {
        document.getElementById('message').style.display = 'block';
        document.getElementById('music').play();
        displayPhotoShapes(); // Show the surprise animation/photos immediately
        // Show loading after message
        setTimeout(() => {
            document.getElementById('loading-animation').style.display = 'flex';
            // After 5 seconds, hide loading and show Valentine question
            setTimeout(() => {
                document.getElementById('loading-animation').style.display = 'none';
                showValentineQuestion();
            }, 5000); // 5 seconds
        }, 500); // Show loading after 0.5s
    }
</script>
</body>
</html>
